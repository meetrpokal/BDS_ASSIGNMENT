# Optional: a small local Spark standalone cluster (1 master + 2 workers)
# for demonstrating the cluster setup without extra machines.
#
#   docker compose up -d
#   Spark master UI:  http://localhost:8080
#   Master URL:       spark://localhost:7077
#
# For quick runs on one machine, `--master local[*]` is simpler.
services:
  spark-master:
    image: apache/spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark-data
      - ./shared:/opt/spark-shared

  spark-worker-1:
    image: apache/spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/spark-data
      - ./shared:/opt/spark-shared

  spark-worker-2:
    image: apache/spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/spark-data
      - ./shared:/opt/spark-shared
