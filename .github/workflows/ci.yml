name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (fail on syntax errors and undefined names)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (style warnings only)
        run: flake8 . --exit-zero --max-line-length=120 --statistics

      - name: Run unit tests
        run: pytest
